<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genove · Digital card</title>
<style>
:root{--bg:#000;--panel:#0d0d0c;--line:#2a2620;--text:#e8cda7;--muted:#a89a84;--gold:#e9bd3c;--sage:#9dae8e;--clay:#d4967a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:420px}
.logo{display:block;width:100%;height:auto;border-radius:6px}
h1{font-size:1.15rem;font-weight:600;margin:22px 0 4px;letter-spacing:.01em}
.role{color:var(--muted);margin:0 0 22px;line-height:1.45;font-size:.95rem}
.svc{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 24px}.svc li{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--text)}.svc li:nth-child(3),.svc li:nth-child(4){border-color:var(--gold)}.actions{display:grid;gap:10px}
a.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;background:var(--panel);transition:border-color .15s}
a.btn:hover,a.btn:focus-visible{border-color:var(--gold);outline:none}
a.btn b{display:block;font-weight:600;font-size:.98rem}
a.btn small{color:var(--muted);font-size:.82rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.qr{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:16px}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--text);color:#000}
.tabs button:focus-visible{outline:2px solid var(--gold)}
#qrbox{background:#fff;padding:12px;border-radius:8px;display:inline-block;line-height:0}
#hint{color:var(--muted);font-size:.85rem;margin:14px 0 0;line-height:1.4}
footer{margin-top:22px;color:var(--muted);font-size:.8rem;text-align:center}
</style></head><body>
